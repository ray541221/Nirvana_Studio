<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preload" as="image" href="./assets/video/hero-poster.jpg" fetchpriority="high">
  <title>網站首頁影音</title>
  <style>
    * { box-sizing: border-box; }
    :root { --gold: #e2bb73; --gold-soft: #cda96a; }
    html, body {
      width: 100%; min-height: 100%; margin: 0; background: #050505; overflow-x: hidden;
      overflow-y: auto; overscroll-behavior-y: auto; touch-action: pan-y;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main.home-page {
      position: relative; width: 100vw; height: 100dvh; min-height: 100dvh; overflow: hidden;
      display: grid; grid-template-rows: 35% 27.5% 37.5%;
      background: #050505 url('./assets/brand/homepage-gold-atmosphere.jpg') center / cover no-repeat;
    }
    .ambient { position: relative; min-width: 0; overflow: hidden; color: var(--gold); }
    .ambient-copy { position: absolute; left: 18%; right: 7%; z-index: 2; }
    .ambient-copy::before {
      content: ""; position: absolute; left: -30px; top: -53px; width: 2px; height: 150px;
      background: var(--gold); opacity: .95;
    }
    .ambient-top .ambient-copy { top: 54%; }
    .ambient-bottom .ambient-copy { top: 24%; }
    .ambient-bottom .ambient-copy::before { top: -38px; height: 122px; }
    .ambient-label {
      margin: 0; color: var(--gold); font-size: clamp(10px, 2.7vw, 15px); font-weight: 500;
      letter-spacing: .34em; line-height: 1.25; white-space: nowrap;
      text-shadow: 0 1px 12px rgba(0, 0, 0, .7);
    }
    .ambient-rule { display: block; width: 78px; height: 2px; margin-top: 19px; background: var(--gold); }
    .video-stage { position: relative; z-index: 3; width: 100%; height: 100%; display: grid; place-items: center; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; display: block; object-fit: contain; object-position: center; background: #000; }
    .page-actions {
      position: absolute; right: 8%; bottom: max(5.5%, env(safe-area-inset-bottom)); z-index: 10;
      display: flex; flex-direction: row; align-items: center; gap: 24px; justify-content: flex-end;
    }
    .page-link {
      min-width: 178px; border: 1.5px solid var(--gold); border-radius: 999px; padding: 13px 24px;
      color: var(--gold); background: rgba(0, 0, 0, .14); font-size: 17px; font-weight: 500;
      line-height: 1; text-align: center; text-decoration: none; cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 0, 0, .28); transition: background .2s ease, color .2s ease;
    }
    .page-link span { margin-left: 14px; font-size: 24px; line-height: 0; vertical-align: -2px; }
    .page-link:hover, .page-link:focus-visible { color: #080808; background: var(--gold); }
    .audio-toggle {
      width: 58px; height: 58px; display: grid; place-items: center; padding: 0;
      border: 1.5px solid var(--gold); border-radius: 50%; color: var(--gold);
      background: rgba(0, 0, 0, .12); cursor: pointer; transition: background .2s ease;
    }
    .audio-toggle:hover, .audio-toggle:focus-visible { background: rgba(226, 187, 115, .16); }
    .audio-toggle svg { width: 32px; height: 32px; display: block; }
    /* A phone held sideways can report a CSS width above 769px (especially on
       high-density screens). Only a genuinely large desktop gets the full-
       bleed video treatment; landscape phones keep the composed mobile layout. */
    @media (min-width: 1100px) and (min-height: 701px) {
      main.home-page { display: block; background: #000; }
      .ambient { display: none; }
      .video-stage { width: 100%; height: 100%; }
      video { object-fit: cover; }
      .page-actions { position: fixed; right: 24px; bottom: 24px; }
    }
    @media (orientation: landscape) and (max-height: 700px) {
      main.home-page { display: grid; grid-template-rows: 34% 32% 34%; background: #050505 url('./assets/brand/homepage-gold-atmosphere.jpg') center / cover no-repeat; }
      .ambient { display: block; }
      .video-stage { width: 100%; height: 100%; }
      .page-actions { position: absolute; }
      .ambient-copy { left: 17%; right: 5%; }
      .ambient-copy::before { left: -24px; top: -42px; height: 120px; }
      .ambient-bottom .ambient-copy { top: 22%; }
      .page-actions { right: 6%; bottom: max(6%, env(safe-area-inset-bottom)); gap: 18px; }
      .page-link { min-width: 164px; padding-block: 12px; }
    }
    @media (max-width: 420px) {
      .ambient-copy { left: 17%; }
      .ambient-copy::before { left: -25px; }
      .ambient-label { font-size: 10px; letter-spacing: .27em; }
      .page-actions { right: 7%; gap: 16px; }
      .page-link { min-width: 154px; padding-inline: 17px; font-size: 16px; }
      .audio-toggle { width: 54px; height: 54px; }
    }
  </style>
</head>
<body>
  <main class="home-page">
    <section class="ambient ambient-top" aria-label="品牌理念">
      <div class="ambient-copy">
        <p class="ambient-label">CREATIVITY&nbsp; / &nbsp;DESIGN&nbsp; / &nbsp;VALUE</p>
        <span class="ambient-rule" aria-hidden="true"></span>
      </div>
    </section>
    <div class="video-stage">
      <video id="heroVideo" poster="./assets/video/hero-poster.jpg" preload="auto" autoplay muted loop playsinline disableRemotePlayback x-webkit-airplay="deny" aria-label="Nirvana Studio 首頁影片"></video>
      <noscript><p><a href="./assets/video/hero-720p.mp4">播放首頁影片</a></p></noscript>
    </div>
    <section class="ambient ambient-bottom" aria-label="作品導覽">
      <div class="ambient-copy">
        <p class="ambient-label">SELECTED&nbsp; WORKS&nbsp; / &nbsp;PORTFOLIO</p>
        <span class="ambient-rule" aria-hidden="true"></span>
      </div>
    </section>
    <nav class="page-actions" aria-label="頁面導覽">
      <button class="audio-toggle" id="audioToggle" type="button" aria-label="開啟背景音樂" aria-pressed="false" title="開啟背景音樂">
        <svg viewBox="0 0 360 360" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M72 154h44l70-57v166l-70-57H72z" stroke-width="18"/>
            <path data-audio-waves d="M222 137c21 24 21 62 0 86M250 113c34 37 34 97 0 134" stroke-width="16"/>
            <path data-audio-slash d="M104 91l164 178" stroke-width="20"/>
          </g>
        </svg>
      </button>
      <a class="page-link" href="./page2.html#works" aria-label="進入作品區">進入 <span aria-hidden="true">→</span></a>
    </nav>
  </main>
  <script>
    const heroVideo = document.querySelector('#heroVideo');
    const audioToggle = document.querySelector('#audioToggle');
    heroVideo.muted = true;
    heroVideo.volume = 0;
    heroVideo.disableRemotePlayback = true;
    const MIN_BUFFER_SECONDS = 3;
    const connection = navigator.connection;
    const isFastLargeDesktop = window.matchMedia('(min-width: 1600px)').matches
      && connection && connection.effectiveType === '4g'
      && Number(connection.downlink) >= 8 && !connection.saveData;
    const mp4Source = isFastLargeDesktop ? './assets/video/hero-1080p.mp4' : './assets/video/hero-720p.mp4';
    const canPlayWebm = heroVideo.canPlayType('video/webm; codecs="vp9, opus"') !== '';
    const preferredSource = canPlayWebm && !isFastLargeDesktop ? './assets/video/hero-720p.webm' : mp4Source;
    let playbackStarted = false;
    heroVideo.src = preferredSource;
    heroVideo.load();
    function bufferedAhead() {
      const currentTime = heroVideo.currentTime;
      for (let i = 0; i < heroVideo.buffered.length; i += 1) {
        if (currentTime >= heroVideo.buffered.start(i) && currentTime <= heroVideo.buffered.end(i)) {
          return heroVideo.buffered.end(i) - currentTime;
        }
      }
      return 0;
    }
    async function tryStartPlayback() {
      if (playbackStarted || heroVideo.readyState < HTMLMediaElement.HAVE_FUTURE_DATA) return;
      if (bufferedAhead() < MIN_BUFFER_SECONDS) return;
      try {
        await heroVideo.play();
        playbackStarted = true;
        window.clearInterval(bufferPoll);
      } catch (error) {
        // Keep the poster visible if autoplay is blocked by the browser.
      }
    }
    const bufferPoll = window.setInterval(tryStartPlayback, 250);
    heroVideo.addEventListener('loadeddata', tryStartPlayback);
    heroVideo.addEventListener('canplay', tryStartPlayback);
    heroVideo.addEventListener('progress', tryStartPlayback);
    heroVideo.addEventListener('error', () => {
      if (heroVideo.src.endsWith('.webm')) {
        heroVideo.src = './assets/video/hero-720p.mp4';
        heroVideo.load();
      }
    }, { once: true });
    function updateAudioButton() {
      const soundOn = !heroVideo.muted && heroVideo.volume > 0;
      const label = soundOn ? '關閉背景音樂' : '開啟背景音樂';
      const slash = audioToggle.querySelector('[data-audio-slash]');
      const waves = audioToggle.querySelector('[data-audio-waves]');
      if (slash) slash.style.display = soundOn ? 'none' : '';
      if (waves) waves.style.display = soundOn ? '' : 'none';
      audioToggle.setAttribute('aria-label', label);
      audioToggle.title = label;
      audioToggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    }
    async function setAudio(enabled) {
      heroVideo.muted = !enabled;
      heroVideo.volume = enabled ? 1 : 0;
      try {
        await heroVideo.play();
        playbackStarted = true;
        window.clearInterval(bufferPoll);
      } catch (error) {
        if (enabled) {
          heroVideo.muted = true;
          heroVideo.volume = 0;
        }
      }
      updateAudioButton();
    }
    audioToggle.addEventListener('click', () => {
      setAudio(heroVideo.muted || heroVideo.volume === 0);
    });
    heroVideo.addEventListener('volumechange', updateAudioButton);
    updateAudioButton();
  </script>
</body>
</html>
