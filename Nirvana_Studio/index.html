<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>網站首頁影音</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100vw;
      height: 100svh;
      background: #000;
    }

    .video-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .page-actions {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .page-link {
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 999px;
      padding: 12px 18px;
      color: rgba(255, 255, 255, .5);
      background: rgba(0, 0, 0, .35);
      font-size: 16px;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
    }

    .audio-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 3;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 999px;
      padding: 11px 16px;
      color: rgba(255, 255, 255, .75);
      background: rgba(0, 0, 0, .35);
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .page-link {
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      main {
        display: grid;
        place-items: center;
      }

      .video-stage {
        width: 100vw;
        height: auto;
        aspect-ratio: 16 / 9;
        max-height: 100svh;
      }

      video {
        object-fit: contain;
      }

      .page-actions {
        top: auto;
        left: auto;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        max-width: calc(100vw - 28px);
        gap: 8px;
        justify-content: flex-end;
      }

      .page-link {
        border-color: rgba(255, 215, 0, .5);
        color: rgba(255, 215, 0, .5) !important;
        padding: 9px 13px;
        font-size: 13px;
      }

      .page-link {
        padding: 9px 13px;
        font-size: 13px;
      }

      .audio-toggle {
        top: max(12px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        border-color: rgba(255, 215, 0, .5);
        color: rgba(255, 215, 0, .65);
        padding: 9px 13px;
        font-size: 13px;
      }

    }
  </style>
</head>
<body>
  <main>
    <div class="video-stage">
      <video id="heroVideo" poster="./assets/video/hero-poster.jpg" preload="auto" autoplay muted loop playsinline controls></video>
      <noscript><p><a href="./assets/video/hero-720p.mp4">播放首頁影片</a></p></noscript>
      <button class="audio-toggle" id="audioToggle" type="button" aria-pressed="false">開啟背景音樂</button>
      <nav class="page-actions" aria-label="頁面導覽">
        <a class="page-link" href="./page2.html#works">作品展示區</a>
        <a class="page-link" href="./page2.html#contact">聯絡我們</a>
      </nav>
    </div>
  </main>
  <script>
    const heroVideo = document.querySelector('#heroVideo');
    const audioToggle = document.querySelector('#audioToggle');

    // Select once, before loading: do not download the large source on phones
    // or restart playback when the viewport or connection changes.
    const connection = navigator.connection;
    const useLightVideo = window.matchMedia('(max-width: 1024px), (pointer: coarse)').matches
      || (connection && (connection.saveData || /(^|-)2g$|^3g$/.test(connection.effectiveType)));
    heroVideo.src = useLightVideo
      ? './assets/video/hero-720p.mp4'
      : './assets/video/hero-1080p.mp4';

    function updateAudioButton() {
      const soundOn = !heroVideo.muted && heroVideo.volume > 0;
      audioToggle.textContent = soundOn ? '關閉背景音樂' : '開啟背景音樂';
      audioToggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    }

    async function setAudio(enabled) {
      heroVideo.muted = !enabled;
      heroVideo.volume = enabled ? 1 : 0;
      try {
        await heroVideo.play();
      } catch (error) {
        heroVideo.muted = true;
      }
      updateAudioButton();
    }

    audioToggle.addEventListener('click', () => {
      setAudio(heroVideo.muted || heroVideo.volume === 0);
    });
    heroVideo.addEventListener('volumechange', updateAudioButton);
    updateAudioButton();
  </script>
</body>
</html>
