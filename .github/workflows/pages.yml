name: Deploy Nirvana_Studio website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python for artwork previews
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build lightweight artwork previews
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build-thumbnails.py

      - name: Build web-optimized homepage videos
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-noto-cjk
          elif [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
          fi
          mkdir -p Nirvana_Studio/assets/video
          ffmpeg -nostdin -y -hide_banner -loglevel error -i Nirvana_Studio/網站首頁影音.mp4 \
            -filter_complex_script scripts/hero-filter.txt -map '[v]' -map 0:a:0 \
            -c:v libx264 -preset fast -crf 24 -maxrate 2800k -bufsize 5600k \
            -profile:v high -level:v 4.0 -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 96k -movflags +faststart Nirvana_Studio/assets/video/hero-1080p.mp4
          ffmpeg -nostdin -y -hide_banner -loglevel error -i Nirvana_Studio/assets/video/hero-1080p.mp4 \
            -map 0:v:0 -map 0:a:0 -vf scale=1280:720 \
            -c:v libx264 -preset fast -crf 25 -maxrate 1200k -bufsize 2400k \
            -profile:v high -level:v 3.1 -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 96k -movflags +faststart Nirvana_Studio/assets/video/hero-720p.mp4
          ffmpeg -nostdin -y -hide_banner -loglevel error -i Nirvana_Studio/assets/video/hero-720p.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -c:v libvpx-vp9 -b:v 0 -crf 34 -deadline good -cpu-used 4 -row-mt 1 \
            -c:a libopus -b:a 64k Nirvana_Studio/assets/video/hero-720p.webm
          ffmpeg -nostdin -y -hide_banner -loglevel error -ss 0 -i Nirvana_Studio/網站首頁影音.mp4 \
            -frames:v 1 -vf scale=1280:720 -q:v 3 Nirvana_Studio/assets/video/hero-poster.jpg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Nirvana_Studio

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
